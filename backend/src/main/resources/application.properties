# Server Port
server.port=8080

# Application Name
spring.application.name=travelmate-backend

# DataSource Configuration (Default: H2 in-memory with MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:travelmate_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# JWT Properties
travelmate.jwt.secret=6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B
travelmate.jwt.expiration=86400000

# CORS Configuration
travelmate.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000

# Swagger / Springdoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
